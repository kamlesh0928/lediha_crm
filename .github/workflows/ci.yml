name: ci
on:
  pull_request:
  push:
    branches: [main, develop]
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the project files are committed
        run: |
          grep -q "supabase_flutter" pubspec.yaml || { echo "pubspec.yaml has no dependencies - commit your pubspec.yaml"; exit 1; }
          test -f lib/main.dart || { echo "lib/main.dart is missing"; exit 1; }
          test -d android || { echo "android/ folder is not committed"; exit 1; }
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --debug
