name: nightly-backup
on:
  schedule:
    - cron: "30 20 * * *"   # 02:00 India time
  workflow_dispatch:
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download all data as CSV
        run: python backup/backup.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: lediha-backup-${{ github.run_number }}
          path: backup_out/
          retention-days: 30
